                (SELECT count(*) FROM public.paper_accounts),
                (SELECT count(*) FROM public.paper_equity_positions),
                (SELECT count(*) FROM public.paper_derivative_positions),
                (SELECT count(*) FROM public.paper_orders),
                (SELECT count(*) FROM public.paper_derivative_orders),
                (SELECT count(*) FROM public.paper_watchlists);
