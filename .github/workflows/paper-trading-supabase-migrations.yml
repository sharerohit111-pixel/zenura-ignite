name: Paper Trading Supabase SQL smoke test

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/paper-trading-supabase-migrations.yml"
  workflow_dispatch:

jobs:
  postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_trading_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          SQL
      - name: Apply ordered draft migrations to disposable PostgreSQL
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Exercise account initialization and account read isolation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222');
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          SELECT public.initialize_paper_trading_account('22222222-2222-4222-8222-222222222222');
          RESET ROLE;
          UPDATE public.paper_accounts
             SET cash_paise=76543210, reserved_cash_paise=100
           WHERE user_id='11111111-1111-4111-8111-111111111111';
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          RESET ROLE;
          DO $
          BEGIN
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 76543210 THEN
              RAISE EXCEPTION 'Account retry reset an existing cash balance';
            END IF;
            IF (SELECT reserved_cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 100 THEN
              RAISE EXCEPTION 'Account retry reset an existing reservation';
            END IF;
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='22222222-2222-4222-8222-222222222222') <> 100000000 THEN
              RAISE EXCEPTION 'New account did not receive the expected 10 lakh virtual capital';
            END IF;
          END
          $;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          DO $
          BEGIN
            IF (SELECT count(*) FROM public.paper_accounts) <> 1 THEN
              RAISE EXCEPTION 'Authenticated user can see another user account or cannot see own account';
            END IF;
          END
          $;
          RESET ROLE;
          SQL
      - name: Verify expected schema and RPC registration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            expected_tables text[] := ARRAY[
              'paper_user_identity_map','paper_accounts','paper_equity_positions',
              'paper_derivative_positions','paper_orders','paper_derivative_orders',
              'paper_watchlists','upstox_connections','upstox_oauth_states',
              'upstox_connection_controls','paper_market_stream_leases',
              'paper_market_worker_state','paper_margin_preview_limits'
            ];
            table_name text;
          BEGIN
            FOREACH table_name IN ARRAY expected_tables LOOP
              IF to_regclass('public.' || table_name) IS NULL THEN
                RAISE EXCEPTION 'Missing expected table: %', table_name;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM pg_tables
                WHERE schemaname='public' AND tablename = ANY(expected_tables)) <> 13 THEN
              RAISE EXCEPTION 'Unexpected public table count for migration schema';
            END IF;
            IF to_regprocedure('public.execute_paper_market_order(uuid,text,uuid,text,text,text,text,text,text,integer,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.submit_paper_limit_order(uuid,text,uuid,text,text,text,text,text,integer,bigint)') IS NULL
              OR to_regprocedure('public.execute_paper_limit_fill(text,bigint,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.cancel_paper_limit_order(uuid,text)') IS NULL
              OR to_regprocedure('public.initialize_paper_trading_account(uuid)') IS NULL
              OR to_regprocedure('public.execute_paper_long_option_order(uuid,text,uuid,text,text,text,text,text,text,date,numeric,integer,integer,integer,text,bigint,bigint,bigint)') IS NULL THEN
              RAISE EXCEPTION 'One or more expected trading RPC functions are missing';
            END IF;
          END
          $$;
          SQL
