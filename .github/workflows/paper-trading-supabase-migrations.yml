      - name: Verify SQL option contract and quote-age boundaries
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $freshness$
          BEGIN
            IF NOT public._paper_quote_age_is_fresh(1000,15999) THEN
              RAISE EXCEPTION '14,999ms quote must be accepted';
            END IF;
            IF NOT public._paper_quote_age_is_fresh(1000,16000) THEN
              RAISE EXCEPTION '15,000ms quote must be accepted';
            END IF;
            IF public._paper_quote_age_is_fresh(1000,16001) THEN
              RAISE EXCEPTION '15,001ms quote must be rejected';
            END IF;
            IF public._paper_quote_age_is_fresh(1001,1000) THEN
              RAISE EXCEPTION 'Future quote must be rejected';
            END IF;
            IF public._paper_quote_age_is_fresh(NULL,1000)
               OR public._paper_quote_age_is_fresh(1000,NULL) THEN
              RAISE EXCEPTION 'Null quote clock values must be rejected';
            END IF;
          END;
          $freshness$;
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('12121212-1212-4212-8212-121212121212');
          RESET ROLE;
          DO $contract$
          DECLARE
            v_now bigint := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            v_result jsonb;
          BEGIN
            -- Both CE and PE are accepted for matching NSE_FO identity.
            v_result:=public.execute_paper_long_option_order(
              '12121212-1212-4212-8212-121212121212','abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789',
              '51515151-5151-4151-8151-515151515151',repeat('a',64),
              'NSE_FO|PARITYCE','PARITYCE','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'BUY',1285,v_now-14000,v_now
            );
            v_result:=public.execute_paper_long_option_order(
              '12121212-1212-4212-8212-121212121212','fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210',
              '52525252-5252-4252-8252-525252525252',repeat('b',64),
              'NSE_FO|PARITYPE','PARITYPE','NSE','NSE_FO','PE',
              current_date+10,22000,25,5,1,'BUY',1285,v_now-14000,v_now
            );
            -- A quote safely older than 15 seconds must fail.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','0123abcd4567ef890123abcd4567ef890123abcd4567ef890123abcd4567ef89',
                '53535353-5353-4353-8353-535353535353',repeat('c',64),
                'NSE_FO|STALE16','STALE16','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,v_now-16000,v_now
              );
              RAISE EXCEPTION '16-second-old Options quote was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            -- Exchange and segment must agree.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','89ef6745cdab230189ef6745cdab230189ef6745cdab230189ef6745cdab2301',
                '54545454-5454-4454-8454-545454545454',repeat('d',64),
                'NSE_FO|BADVENUE','BADVENUE','BSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
              );
              RAISE EXCEPTION 'Mismatched exchange/segment was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            -- Tick size must be positive and execution price must be tick-aligned.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','13579bdf2468ace013579bdf2468ace013579bdf2468ace013579bdf2468ace0',
                '55555555-5555-4555-8555-555555555555',repeat('e',64),
                'NSE_FO|BADTICK','BADTICK','NSE','NSE_FO','CE',
                current_date+10,22000,25,0,1,'BUY',1285,v_now,v_now
              );
              RAISE EXCEPTION 'Zero tick size was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','02468ace13579bdf02468ace13579bdf02468ace13579bdf02468ace13579bdf',
                '56565656-5656-4656-8656-565656565656',repeat('f',64),
                'NSE_FO|OFFTICK2','OFFTICK2','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1286,v_now,v_now
              );
              RAISE EXCEPTION 'Off-tick option price was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            -- The database rejects a caller clock outside the +/-2s tolerance.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','55aa66bb77cc88dd55aa66bb77cc88dd55aa66bb77cc88dd55aa66bb77cc88dd',
                '57575757-5757-4757-8757-575757575757',repeat('1',64),
                'NSE_FO|CLOCKSKEW','CLOCKSKEW','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,v_now-1000,v_now-2001
              );
              RAISE EXCEPTION 'Caller clock skew above two seconds was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            -- Expired contracts must fail independent of quote freshness.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '12121212-1212-4212-8212-121212121212','aa55bb66cc77dd88aa55bb66cc77dd88aa55bb66cc77dd88aa55bb66cc77dd88',
                '58585858-5858-4858-8858-585858585858',repeat('2',64),
                'NSE_FO|EXPIRED2','EXPIRED2','NSE','NSE_FO','PE',
                current_date-1,22000,25,5,1,'BUY',1285,v_now,v_now
              );
              RAISE EXCEPTION 'Expired option contract was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
          END
          $contract$;
          SQL
      - name: Verify catalog-level tenant isolation, private grants and SECURITY DEFINER boundaries
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation_catalog.sql
      - name: Verify RLS and privileged RPC boundaries
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            t text;
            protected_tables text[] := ARRAY[
              'paper_accounts','paper_equity_positions',
              'paper_derivative_positions','paper_orders','paper_derivative_orders',
              'paper_watchlists','upstox_connections','upstox_oauth_states',
              'upstox_connection_controls','paper_market_stream_leases',
              'paper_market_worker_state','paper_margin_preview_limits',
              'paper_futures_positions','paper_futures_orders','paper_protective_orders',
              'paper_chart_drawings','paper_chart_templates','paper_chart_preferences'
            ];
          BEGIN
            FOREACH t IN ARRAY protected_tables LOOP
              IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid=to_regclass('public.'||t)) THEN
                RAISE EXCEPTION 'RLS is disabled on %',t;
              END IF;
            END LOOP;
            IF EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public'
                AND p.proname IN (
                  'current_paper_user_id','execute_paper_market_order','submit_paper_limit_order',
                  'execute_paper_limit_fill','cancel_paper_limit_order',
                  'initialize_paper_trading_account','execute_paper_long_option_order'
                )
                AND COALESCE(array_to_string(p.proconfig,','),'') NOT LIKE '%search_path=""%'
            ) THEN
              RAISE EXCEPTION 'A privileged trading RPC does not pin an empty search_path';
            END IF;
            IF (SELECT count(*) FROM pg_policies
                WHERE schemaname='public'
                  AND cmd='SELECT'
                  AND tablename IN ('paper_accounts','paper_equity_positions',
                    'paper_derivative_positions','paper_orders',
                    'paper_derivative_orders','paper_watchlists')
                  AND qual LIKE '%auth.uid()%') <> 6 THEN
              RAISE EXCEPTION 'Expected six user-scoped SELECT policies were not found';
            END IF;
            IF has_function_privilege('anon','public.rls_auto_enable()','EXECUTE')
               OR has_function_privilege('authenticated','public.rls_auto_enable()','EXECUTE')
               OR has_function_privilege('service_role','public.rls_auto_enable()','EXECUTE') THEN
              RAISE EXCEPTION 'RLS auto-enable event-trigger function remains directly executable by API roles';
            END IF;
            IF NOT has_function_privilege('postgres','public.rls_auto_enable()','EXECUTE') THEN
              RAISE EXCEPTION 'RLS auto-enable function owner execution was unexpectedly revoked';
            END IF;
            IF has_table_privilege('authenticated','public.paper_accounts','INSERT')
               OR has_table_privilege('authenticated','public.paper_accounts','UPDATE')
               OR has_table_privilege('authenticated','public.paper_accounts','DELETE')
               OR has_table_privilege('anon','public.paper_accounts','SELECT') THEN
              RAISE EXCEPTION 'Unexpected browser-role privilege on protected account data';
            END IF;
            IF has_function_privilege('authenticated',
              'public.execute_paper_market_order(uuid,text,uuid,text,text,text,text,text,text,integer,bigint,bigint,bigint)','EXECUTE')
               OR has_function_privilege('anon',
              'public.execute_paper_market_order(uuid,text,uuid,text,text,text,text,text,text,integer,bigint,bigint,bigint)','EXECUTE')
               OR NOT has_function_privilege('service_role',
              'public.execute_paper_market_order(uuid,text,uuid,text,text,text,text,text,text,integer,bigint,bigint,bigint)','EXECUTE') THEN
              RAISE EXCEPTION 'MARKET RPC execution grants are not server-only';
            END IF;
          END
          $$;
          SQL
