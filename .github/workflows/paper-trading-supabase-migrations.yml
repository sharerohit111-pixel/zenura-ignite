              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            SELECT net_quantity,cost_basis_paise,average_price_paise
              INTO v_qty,v_basis,v_avg FROM public.paper_derivative_positions
             WHERE user_id='88888888-8888-4888-8888-888888888888'
               AND instrument_key='NSE_FO|REPEAT';
            IF v_qty<>75 OR v_basis<>98778 OR v_avg<>1317 THEN
              RAISE EXCEPTION 'Initial repeated-close reference position mismatch: qty %, basis %, avg %',v_qty,v_basis,v_avg;
            END IF;
            -- First partial close: 98,778 × 25 / 75 rounds to 32,926 paise.
            v_result:=public.execute_paper_long_option_order(
              '88888888-8888-4888-8888-888888888888','b1c2d3e4b1c2d3e4b1c2d3e4b1c2d3e4b1c2d3e4b1c2d3e4b1c2d3e4b1c2d3e4',
              '32323232-3232-4232-8232-323232323232',repeat('4',64),
              'NSE_FO|REPEAT','REPEAT','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'SELL',1500,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            IF (v_result->'order'->>'realized_pnl_paise')::bigint<>2143 THEN
              RAISE EXCEPTION 'First partial-close realized P&L diverges from Firebase BigInt vector';
            END IF;
            SELECT net_quantity,cost_basis_paise,average_price_paise
              INTO v_qty,v_basis,v_avg FROM public.paper_derivative_positions
             WHERE user_id='88888888-8888-4888-8888-888888888888'
               AND instrument_key='NSE_FO|REPEAT';
            IF v_qty<>50 OR v_basis<>65852 OR v_avg<>1317 THEN
              RAISE EXCEPTION 'First partial-close remainder mismatch: qty %, basis %, avg %',v_qty,v_basis,v_avg;
            END IF;
            -- Repeated partial close: half of 65,852 rounds to 32,926 paise.
            v_result:=public.execute_paper_long_option_order(
              '88888888-8888-4888-8888-888888888888','c1d2e3f4c1d2e3f4c1d2e3f4c1d2e3f4c1d2e3f4c1d2e3f4c1d2e3f4c1d2e3f4',
              '33333333-3333-4333-8333-333333333333',repeat('6',64),
              'NSE_FO|REPEAT','REPEAT','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'SELL',1500,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            IF (v_result->'order'->>'realized_pnl_paise')::bigint<>2143 THEN
              RAISE EXCEPTION 'Second partial-close realized P&L diverges from Firebase BigInt vector';
            END IF;
            SELECT net_quantity,cost_basis_paise,average_price_paise
              INTO v_qty,v_basis,v_avg FROM public.paper_derivative_positions
             WHERE user_id='88888888-8888-4888-8888-888888888888'
               AND instrument_key='NSE_FO|REPEAT';
            IF v_qty<>25 OR v_basis<>32926 OR v_avg<>1317 THEN
              RAISE EXCEPTION 'Second partial-close remainder mismatch: qty %, basis %, avg %',v_qty,v_basis,v_avg;
            END IF;
            -- Final close must consume the exact remaining basis without rounding drift.
            v_result:=public.execute_paper_long_option_order(
              '88888888-8888-4888-8888-888888888888','d1e2f3a4d1e2f3a4d1e2f3a4d1e2f3a4d1e2f3a4d1e2f3a4d1e2f3a4d1e2f3a4',
              '34343434-3434-4434-8434-343434343434',repeat('8',64),
              'NSE_FO|REPEAT','REPEAT','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'SELL',1500,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            IF (v_result->'order'->>'realized_pnl_paise')::bigint<>2143
               OR EXISTS (SELECT 1 FROM public.paper_derivative_positions
                 WHERE user_id='88888888-8888-4888-8888-888888888888'
                   AND instrument_key='NSE_FO|REPEAT') THEN
              RAISE EXCEPTION 'Final close failed to consume the remaining fee-inclusive basis exactly';
            END IF;
          END
          $parity$;
          SQL
      - name: Verify add-on BUY, insufficient cash rollback and 50-position cap
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('99999999-9999-4999-8999-999999999999');
          RESET ROLE;
          DO $parity$
          DECLARE
            v_now bigint := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            v_first jsonb;
            v_second jsonb;
            v_third jsonb;
            v_basis bigint;
            v_cash bigint;
            v_qty bigint;
            v_count bigint;
            v_debit bigint;
          BEGIN
            -- Two independent BUY fills on the same contract must accumulate basis and quantity.
            v_first:=public.execute_paper_long_option_order(
              '99999999-9999-4999-8999-999999999999',repeat('1',64),
              '41414141-4141-4141-8141-414141414141',repeat('a',64),
              'NSE_FO|ADDON','ADDON','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
            );
            v_second:=public.execute_paper_long_option_order(
              '99999999-9999-4999-8999-999999999999',repeat('2',64),
              '42424242-4242-4242-8242-424242424242',repeat('b',64),
              'NSE_FO|ADDON','ADDON','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
            );
            SELECT net_quantity,cost_basis_paise INTO v_qty,v_basis
              FROM public.paper_derivative_positions
             WHERE user_id='99999999-9999-4999-8999-999999999999'
               AND instrument_key='NSE_FO|ADDON';
            v_debit:=(v_first->'order'->>'total_debit_paise')::bigint
                    +(v_second->'order'->>'total_debit_paise')::bigint;
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='99999999-9999-4999-8999-999999999999';
            IF v_qty<>50 OR v_basis<>v_debit OR v_cash<>100000000-v_debit THEN
              RAISE EXCEPTION 'Add-on BUY did not conserve fee-inclusive basis, quantity and cash';
            END IF;
            -- Insufficient unreserved cash must roll back both order and position writes.
            UPDATE public.paper_accounts SET cash_paise=10000,reserved_cash_paise=0
             WHERE user_id='99999999-9999-4999-8999-999999999999';
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '99999999-9999-4999-8999-999999999999',repeat('3',64),
                '43434343-4343-4343-8343-434343434343',repeat('c',64),
                'NSE_FO|POOR','POOR','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
              );
              RAISE EXCEPTION 'Insufficient-cash option BUY was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '23514' THEN
              NULL;
            END;
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='99999999-9999-4999-8999-999999999999';
            IF v_cash<>10000 OR EXISTS(
              SELECT 1 FROM public.paper_derivative_orders
               WHERE order_id=repeat('3',64)
            ) OR EXISTS(
              SELECT 1 FROM public.paper_derivative_positions
               WHERE user_id='99999999-9999-4999-8999-999999999999'
                 AND instrument_key='NSE_FO|POOR'
            ) THEN
              RAISE EXCEPTION 'Insufficient-cash rejection left partial database writes';
            END IF;
            -- Restore test cash, then reach exactly 50 open instruments.
            UPDATE public.paper_accounts SET cash_paise=100000000,reserved_cash_paise=0
             WHERE user_id='99999999-9999-4999-8999-999999999999';
            INSERT INTO public.paper_derivative_positions(
              user_id,instrument_key,trading_symbol,segment,exchange,instrument_type,
              expiry,lot_size,net_quantity,average_price_paise,cost_basis_paise
            )
            SELECT '99999999-9999-4999-8999-999999999999',
                   'NSE_FO|CAP'||g,'CAP'||g,'NSE_FO','NSE','CE',
                   current_date+10,25,25,100,2500
              FROM generate_series(1,49) AS g;
            SELECT count(*) INTO v_count FROM public.paper_derivative_positions
             WHERE user_id='99999999-9999-4999-8999-999999999999' AND net_quantity>0;
            IF v_count<>50 THEN RAISE EXCEPTION 'Position-cap fixture did not create 50 open positions'; END IF;
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '99999999-9999-4999-8999-999999999999',repeat('4',64),
                '44444444-4444-4444-8444-444444444444',repeat('d',64),
                'NSE_FO|CAP51','CAP51','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
              );
              RAISE EXCEPTION '51st distinct derivative position was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '23514' THEN
              NULL;
            END;
            IF (SELECT count(*) FROM public.paper_derivative_positions
                WHERE user_id='99999999-9999-4999-8999-999999999999' AND net_quantity>0)<>50
               OR EXISTS(SELECT 1 FROM public.paper_derivative_orders WHERE order_id=repeat('4',64)) THEN
              RAISE EXCEPTION 'Position-cap rejection left a partial order or position';
            END IF;
            -- Add-on BUY to an existing key remains valid while already at the 50-position cap.
            v_third:=public.execute_paper_long_option_order(
              '99999999-9999-4999-8999-999999999999',repeat('5',64),
              '45454545-4545-4545-8545-454545454545',repeat('e',64),
              'NSE_FO|ADDON','ADDON','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'BUY',1285,v_now,v_now
            );
            SELECT net_quantity INTO v_qty FROM public.paper_derivative_positions
             WHERE user_id='99999999-9999-4999-8999-999999999999'
               AND instrument_key='NSE_FO|ADDON';
            IF v_qty<>75 OR (SELECT count(*) FROM public.paper_derivative_positions
                WHERE user_id='99999999-9999-4999-8999-999999999999' AND net_quantity>0)<>50 THEN
              RAISE EXCEPTION 'Add-on BUY was incorrectly blocked at the 50-position limit';
            END IF;
          END
          $parity$;
          SQL
      - name: Verify SQL charges and rounding against Firebase golden vectors
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('66666666-6666-4666-8666-666666666666');
          SELECT public.initialize_paper_trading_account('77777777-7777-4777-8777-777777777777');
          RESET ROLE;
          DO $$
          DECLARE
            v_buy jsonb;
            v_sell jsonb;
            v_bse jsonb;
            v_breakdown jsonb;
            v_option_function text;
          BEGIN
            v_option_function:=pg_get_functiondef('public.execute_paper_long_option_order(uuid,text,uuid,text,text,text,text,text,text,date,numeric,integer,integer,integer,text,bigint,bigint,bigint)'::regprocedure);
            IF position('v_exchange_rate:=0.0003552;' in v_option_function)=0
               OR position('v_ipft_rate:=0.000000001;' in v_option_function)=0
               OR position('v_ipft_rate:=0.000005;' in v_option_function)>0 THEN
              RAISE EXCEPTION 'SQL option charges do not match the NSE transaction/IPFT schedule';
            END IF;
            -- Matches trading-charges.test.js: NSE BUY, gross 81,250 paise.
            v_buy:=public.execute_paper_long_option_order(
              '66666666-6666-4666-8666-666666666666',repeat('a',64),
              '23232323-2323-4323-8323-232323232323',repeat('b',64),
              'NSE_FO|GOLDEN','GOLDEN','NSE','NSE_FO','CE',
              current_date+10,22000,25,5,1,'BUY',3250,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            v_breakdown:=v_buy->'order'->'charges_breakdown';
            IF (v_breakdown->>'exchangeTransactionPaise')::bigint<>29
               OR (v_breakdown->>'ipftPaise')::bigint<>0
               OR (v_breakdown->>'sebiPaise')::bigint<>0
               OR (v_breakdown->>'stampDutyPaise')::bigint<>2
               OR (v_breakdown->>'gstPaise')::bigint<>365
               OR (v_breakdown->>'totalChargesPaise')::bigint<>2396
               OR (v_breakdown->>'totalDebitPaise')::bigint<>83646 THEN
              RAISE EXCEPTION 'NSE BUY charge vector diverges from Firebase JS golden values: %',v_breakdown;
            END IF;
            -- Matches trading-charges.test.js: BSE BUY, gross 100,000 paise.
            v_bse:=public.execute_paper_long_option_order(
              '77777777-7777-4777-8777-777777777777',repeat('c',64),
              '24242424-2424-4424-8424-242424242424',repeat('d',64),
              'BSE_FO|GOLDEN','GOLDEN','BSE','BSE_FO','PE',
              current_date+10,22000,25,5,1,'BUY',4000,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            v_breakdown:=v_bse->'order'->'charges_breakdown';
            IF (v_breakdown->>'exchangeTransactionPaise')::bigint<>33
               OR (v_breakdown->>'totalChargesPaise')::bigint<>2402
               OR (v_breakdown->>'gstPaise')::bigint<>366
               OR (v_breakdown->>'totalDebitPaise')::bigint<>102402 THEN
              RAISE EXCEPTION 'BSE BUY charge vector diverges from Firebase JS golden values: %',v_breakdown;
            END IF;
            -- Seed one contract so the SELL vector exercises the real close path.
            PERFORM public.execute_paper_long_option_order(
              '66666666-6666-4666-8666-666666666666','e1f2a3b4e1f2a3b4e1f2a3b4e1f2a3b4e1f2a3b4e1f2a3b4e1f2a3b4e1f2a3b4',
              '26262626-2626-4626-8626-262626262626',repeat('2',64),
              'NSE_FO|TINY','TINY','NSE','NSE_FO','CE',
              current_date+10,22000,1,1,1,'BUY',1000,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            -- Tiny-premium close: gross 100 paise, fixed charges exceed proceeds.
            v_sell:=public.execute_paper_long_option_order(
              '66666666-6666-4666-8666-666666666666','f1a2b3c4f1a2b3c4f1a2b3c4f1a2b3c4f1a2b3c4f1a2b3c4f1a2b3c4f1a2b3c4',
              '25252525-2525-4525-8525-252525252525',repeat('f',64),
              'NSE_FO|TINY','TINY','NSE','NSE_FO','CE',
              current_date+10,22000,1,1,1,'SELL',100,
              floor(extract(epoch from clock_timestamp())*1000)::bigint,
              floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            v_breakdown:=v_sell->'order'->'charges_breakdown';
            IF (v_breakdown->>'grossPaise')::bigint<>100
               OR (v_breakdown->>'netCreditPaise')::bigint>=0
               OR (v_breakdown->>'stampDutyPaise')::bigint<>0
               OR (v_breakdown->>'totalChargesPaise')::bigint<=100 THEN
              RAISE EXCEPTION 'Tiny-premium negative-net-credit vector mismatch: %',v_breakdown;
            END IF;
          END
          $$;
          SQL
      - name: Exercise concurrent duplicate Options requests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('55555555-5555-4555-8555-555555555555');
          RESET ROLE;
          SQL
          run_option() {
            psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.execute_paper_long_option_order(
            '55555555-5555-4555-8555-555555555555',
            '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef','18181818-1818-4818-8818-181818181818',
            repeat('d',64),'NSE_FO|RACEOPT','RACEOPT','NSE','NSE_FO','CE',
            current_date+10,22000,25,5,1,'BUY',1285,
            floor(extract(epoch from clock_timestamp())*1000)::bigint,
            floor(extract(epoch from clock_timestamp())*1000)::bigint
          );
          RESET ROLE;
          SQL
          }
          run_option & pid1=$!
          run_option & pid2=$!
          wait "$pid1"
          wait "$pid2"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_gross bigint;
            v_charges bigint;
            v_cash bigint;
          BEGIN
            IF (SELECT count(*) FROM public.paper_derivative_orders
                WHERE user_id='55555555-5555-4555-8555-555555555555'
                  AND idempotency_key='18181818-1818-4818-8818-181818181818') <> 1
               OR (SELECT net_quantity FROM public.paper_derivative_positions
                WHERE user_id='55555555-5555-4555-8555-555555555555'
                  AND instrument_key='NSE_FO|RACEOPT') <> 25 THEN
              RAISE EXCEPTION 'Concurrent duplicate Options requests created duplicate order or position quantity';
            END IF;
            SELECT gross_paise,charges_paise INTO v_gross,v_charges
              FROM public.paper_derivative_orders
             WHERE user_id='55555555-5555-4555-8555-555555555555'
               AND idempotency_key='18181818-1818-4818-8818-181818181818';
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='55555555-5555-4555-8555-555555555555';
            IF v_cash <> 100000000-v_gross-v_charges THEN
              RAISE EXCEPTION 'Concurrent duplicate Options requests charged the account more than once';
            END IF;
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '55555555-5555-4555-8555-555555555555',
                repeat('c',64),'18181818-1818-4818-8818-181818181818',
                repeat('e',64),'NSE_FO|RACEOPT','RACEOPT','NSE','NSE_FO','CE',
                current_date+10,22000,25,5,1,'BUY',1285,
                floor(extract(epoch from clock_timestamp())*1000)::bigint,
                floor(extract(epoch from clock_timestamp())*1000)::bigint
              );
              RAISE EXCEPTION 'Options idempotency key accepted a changed fingerprint';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END
          $$;
          SQL
      - name: Exercise futures long, close, reverse, margin and idempotency accounting
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $futures$
          DECLARE
            v_result jsonb;
            v_now bigint;
            v_qty integer;
            v_margin bigint;
            v_cash bigint;
            v_realized bigint;
          BEGIN
            INSERT INTO auth.users(id) VALUES ('abcdefab-cdef-4abc-8def-abcdefabcdef') ON CONFLICT(id) DO NOTHING;
            PERFORM public.initialize_paper_trading_account('abcdefab-cdef-4abc-8def-abcdefabcdef');
            v_now := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            v_result := public.execute_paper_futures_market_order(
              'abcdefab-cdef-4abc-8def-abcdefabcdef',repeat('a',64),
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',repeat('b',64),
              'NSE_FO|FUT_TEST','FUT_TEST','NSE','NSE_FO',current_date+5,
              25,5,'BUY','DELIVERY',50,10000,200000,1000,v_now,v_now
            );
            IF v_result->>'idempotent_replay' <> 'false'
               OR (v_result->>'cash_paise')::bigint <> 99999000
               OR (v_result->>'reserved_margin_paise')::bigint <> 200000 THEN
              RAISE EXCEPTION 'Futures opening BUY accounting mismatch: %',v_result::text;
            END IF;
            v_result := public.execute_paper_futures_market_order(
              'abcdefab-cdef-4abc-8def-abcdefabcdef',repeat('a',64),
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',repeat('b',64),
              'NSE_FO|FUT_TEST','FUT_TEST','NSE','NSE_FO',current_date+5,
              25,5,'BUY','DELIVERY',50,10000,200000,1000,v_now,v_now
            );
            IF v_result->>'idempotent_replay' <> 'true' THEN
              RAISE EXCEPTION 'Duplicate futures BUY was not idempotent';
            END IF;
            v_now := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            PERFORM public.execute_paper_futures_market_order(
              'abcdefab-cdef-4abc-8def-abcdefabcdef',repeat('c',64),
              'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',repeat('d',64),
              'NSE_FO|FUT_TEST','FUT_TEST','NSE','NSE_FO',current_date+5,
              25,5,'SELL','DELIVERY',25,12000,0,1000,v_now,v_now
            );
            SELECT net_quantity,reserved_margin_paise,realized_pnl_paise
              INTO v_qty,v_margin,v_realized
              FROM public.paper_futures_positions
             WHERE user_id='abcdefab-cdef-4abc-8def-abcdefabcdef'
               AND instrument_key='NSE_FO|FUT_TEST';
            IF v_qty<>25 OR v_margin<>100000 OR v_realized<>50000 THEN
              RAISE EXCEPTION 'Partial futures close did not release proportional margin or realize P&L';
            END IF;
            v_now := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            PERFORM public.execute_paper_futures_market_order(
              'abcdefab-cdef-4abc-8def-abcdefabcdef',repeat('e',64),
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc',repeat('f',64),
              'NSE_FO|FUT_TEST','FUT_TEST','NSE','NSE_FO',current_date+5,
              25,5,'SELL','DELIVERY',50,9000,100000,1000,v_now,v_now
            );
            SELECT net_quantity,reserved_margin_paise,average_price_paise
              INTO v_qty,v_margin,v_realized
              FROM public.paper_futures_positions
             WHERE user_id='abcdefab-cdef-4abc-8def-abcdefabcdef'
               AND instrument_key='NSE_FO|FUT_TEST';
            IF v_qty<>-25 OR v_margin<>100000 OR v_realized<>9000 THEN
              RAISE EXCEPTION 'Futures position reversal did not open the remaining short quantity';
            END IF;
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='abcdefab-cdef-4abc-8def-abcdefabcdef';
            IF v_cash<>100022000 THEN
              RAISE EXCEPTION 'Futures realized P&L and charges produced an incorrect cash balance: %',v_cash;
            END IF;
            v_now := floor(extract(epoch from clock_timestamp())*1000)::bigint;
            BEGIN
              PERFORM public.execute_paper_futures_market_order(
                'abcdefab-cdef-4abc-8def-abcdefabcdef',repeat('1',64),
                'dddddddd-dddd-4ddd-8ddd-dddddddddddd',repeat('2',64),
                'NSE_FO|FUT_TEST','FUT_TEST','NSE','NSE_FO',current_date+5,
                25,5,'BUY','DELIVERY',26,10000,100000,0,v_now,v_now
              );
              RAISE EXCEPTION 'Non-lot-multiple futures quantity was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
          END
          $futures$;
          SQL
