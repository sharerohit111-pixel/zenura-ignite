      - name: Verify expected schema and RPC registration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            expected_tables text[] := ARRAY[
              'paper_accounts','paper_equity_positions',
              'paper_derivative_positions','paper_orders','paper_derivative_orders',
              'paper_watchlists','upstox_connections','upstox_oauth_states',
              'upstox_connection_controls','paper_market_stream_leases',
              'paper_market_worker_state','paper_margin_preview_limits',
              'paper_futures_positions','paper_futures_orders','paper_protective_orders',
              'paper_chart_drawings','paper_chart_templates','paper_chart_preferences'
            ];
            table_name text;
          BEGIN
            FOREACH table_name IN ARRAY expected_tables LOOP
              IF to_regclass('public.' || table_name) IS NULL THEN
                RAISE EXCEPTION 'Missing expected table: %', table_name;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM pg_tables
                WHERE schemaname='public' AND tablename = ANY(expected_tables)) <> 18 THEN
              RAISE EXCEPTION 'Unexpected public table count for migration schema';
            END IF;
            IF to_regprocedure('public.execute_paper_market_order(uuid,text,uuid,text,text,text,text,text,text,integer,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.submit_paper_limit_order(uuid,text,uuid,text,text,text,text,text,integer,bigint)') IS NULL
              OR to_regprocedure('public.execute_paper_limit_fill(text,bigint,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.cancel_paper_limit_order(uuid,text)') IS NULL
              OR to_regprocedure('public.initialize_paper_trading_account(uuid)') IS NULL
              OR to_regprocedure('public.execute_paper_futures_market_order(uuid,text,uuid,text,text,text,text,text,date,integer,integer,text,text,integer,bigint,bigint,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.execute_paper_futures_limit_fill(text,text,integer,integer,bigint,bigint,bigint,integer,integer,bigint,bigint,bigint)') IS NULL
              OR to_regprocedure('public.execute_paper_long_option_order(uuid,text,uuid,text,text,text,text,text,text,date,numeric,integer,integer,integer,text,bigint,bigint,bigint)') IS NULL THEN
              RAISE EXCEPTION 'One or more expected trading RPC functions are missing';
            END IF;
          END
