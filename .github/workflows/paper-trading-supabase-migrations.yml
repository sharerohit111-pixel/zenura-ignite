      - name: Verify equity protective fill RPC is server-only and schema-complete
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $protective_rpc$
          BEGIN
            IF to_regprocedure('public.execute_paper_equity_protective_fill(uuid,text,text,bigint,bigint,bigint)') IS NULL THEN
              RAISE EXCEPTION 'Equity protective fill RPC is missing';
            END IF;
            IF has_function_privilege('anon',
                 'public.execute_paper_equity_protective_fill(uuid,text,text,bigint,bigint,bigint)','EXECUTE')
               OR has_function_privilege('authenticated',
                 'public.execute_paper_equity_protective_fill(uuid,text,text,bigint,bigint,bigint)','EXECUTE')
               OR NOT has_function_privilege('service_role',
                 'public.execute_paper_equity_protective_fill(uuid,text,text,bigint,bigint,bigint)','EXECUTE') THEN
              RAISE EXCEPTION 'Equity protective fill RPC is not restricted to service_role';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid=to_regclass('public.paper_protective_orders')) THEN
              RAISE EXCEPTION 'Protective order RLS is disabled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='paper_protective_orders'
                AND column_name='execution_order_id'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND indexname='paper_protective_orders_execution_order_idx'
            ) THEN
              RAISE EXCEPTION 'Protective execution idempotency schema is incomplete';
            END IF;
            IF COALESCE(array_to_string((
              SELECT proconfig FROM pg_proc
              WHERE oid=to_regprocedure('public.execute_paper_equity_protective_fill(uuid,text,text,bigint,bigint,bigint)')
            ),','),'') NOT LIKE '%search_path=""%' THEN
              RAISE EXCEPTION 'Protective fill RPC must pin an empty search_path';
            END IF;
          END
          $protective_rpc$;
          UPDATE public.paper_accounts
             SET starting_cash_paise=100000000,cash_paise=100000000,
                 reserved_cash_paise=0,reserved_margin_paise=0,
                 realized_pnl_paise=0,delivery_realized_pnl_paise=0,
                 intraday_realized_pnl_paise=0,version=1
           WHERE user_id='12121212-1212-4212-8212-121212121212';
          INSERT INTO public.paper_equity_positions(
            user_id,product,instrument_key,trading_symbol,exchange,quantity,
            average_price_paise,cost_basis_paise,reserved_quantity
          ) VALUES (
            '12121212-1212-4212-8212-121212121212','DELIVERY',
            'NSE_EQ|PROTECTIVE_CI','PROTECTIVE_CI','NSE',10,8000,80000,4
          );
          INSERT INTO public.paper_protective_orders(
            order_id,user_id,asset_class,instrument_key,product,side,
            trigger_type,trigger_direction,trigger_price_paise,quantity,status
          ) VALUES (
            'abababab-abab-4bab-8bab-abababababab',
            '12121212-1212-4212-8212-121212121212','EQUITY',
            'NSE_EQ|PROTECTIVE_CI','DELIVERY','SELL',
            'STOP_LOSS','AT_OR_BELOW',10000,4,'ACTIVE'
          );
          SET ROLE service_role;
          DO $protective_fill$
          DECLARE
            v_now bigint:=floor(extract(epoch from clock_timestamp())*1000)::bigint;
            v_result jsonb;
            v_execution_id text:=md5(gen_random_uuid()::text)||md5(gen_random_uuid()::text);
          BEGIN
            v_result:=public.execute_paper_equity_protective_fill(
              'abababab-abab-4bab-8bab-abababababab',
              v_execution_id,repeat('b',64),9000,v_now,v_now
            );
            IF v_result->>'status'<>'FILLED'
               OR (v_result->>'realized_pnl_paise')::bigint<>-757
               OR (v_result->>'charges_paise')::bigint<>4757
               OR (v_result->>'cash_delta_paise')::bigint<>31243 THEN
              RAISE EXCEPTION 'Equity protective fill did not settle net proceeds and fees';
            END IF;
            v_result:=public.execute_paper_equity_protective_fill(
              'abababab-abab-4bab-8bab-abababababab',
              v_execution_id,repeat('b',64),9000,v_now,v_now
            );
            IF (v_result->>'idempotent_replay')::boolean IS NOT TRUE THEN
              RAISE EXCEPTION 'Equity protective retry was not idempotent';
            END IF;
            BEGIN
              PERFORM public.execute_paper_equity_protective_fill(
                'abababab-abab-4bab-8bab-abababababab',
                v_execution_id,repeat('c',64),9000,v_now,v_now
              );
              RAISE EXCEPTION 'Protective retry accepted a different request fingerprint';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;
          END
          $protective_fill$;
          RESET ROLE;
          DO $protective_fill_assertions$
          DECLARE
            v_execution_id text;
          BEGIN
            SELECT execution_order_id INTO v_execution_id
              FROM public.paper_protective_orders
             WHERE order_id='abababab-abab-4bab-8bab-abababababab';
            IF (SELECT quantity FROM public.paper_equity_positions
                WHERE user_id='12121212-1212-4212-8212-121212121212'
                  AND product='DELIVERY' AND instrument_key='NSE_EQ|PROTECTIVE_CI')<>6 THEN
              RAISE EXCEPTION 'Equity protective fill did not reduce position exactly once';
            END IF;
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='12121212-1212-4212-8212-121212121212')<>100031243
               OR (SELECT realized_pnl_paise FROM public.paper_accounts
                WHERE user_id='12121212-1212-4212-8212-121212121212')<>-757
               OR (SELECT delivery_realized_pnl_paise FROM public.paper_accounts
                WHERE user_id='12121212-1212-4212-8212-121212121212')<>-757 THEN
              RAISE EXCEPTION 'Equity protective fill did not update account cash and realized P&L exactly once';
            END IF;
            IF (SELECT cost_basis_paise FROM public.paper_equity_positions
                WHERE user_id='12121212-1212-4212-8212-121212121212'
                  AND product='DELIVERY' AND instrument_key='NSE_EQ|PROTECTIVE_CI')<>48000 THEN
              RAISE EXCEPTION 'Equity protective fill did not preserve remaining position cost basis';
            END IF;
            IF (SELECT count(*) FROM public.paper_orders
                WHERE order_id=v_execution_id AND status='FILLED')<>1 THEN
              RAISE EXCEPTION 'Equity protective fill did not create one canonical filled order';
            END IF;
            IF (SELECT charges_paise FROM public.paper_orders WHERE order_id=v_execution_id)<>4757
               OR (SELECT cash_delta_paise FROM public.paper_orders WHERE order_id=v_execution_id)<>31243
               OR (SELECT charges_breakdown->>'exchange' FROM public.paper_orders WHERE order_id=v_execution_id)<>'NSE' THEN
              RAISE EXCEPTION 'Protective execution order history omitted exchange fee breakdown or net cash delta';
            END IF;
          END
          $protective_fill_assertions$;
          SQL
