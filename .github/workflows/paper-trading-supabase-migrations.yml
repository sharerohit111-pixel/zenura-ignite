name: Paper Trading Supabase SQL smoke test

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/paper-trading-supabase-migrations.yml"
      - ".github/workflows/deploy-supabase-market-gateway.yml"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
      - "markets/**"
      - "markets/stocks/**"
      - "market-gateway/supabase-server.js"
      - "market-gateway/Dockerfile"
      - "market-gateway/package.json"
      - "market-gateway/README.md"
      - "market-gateway/DEPLOYMENT.md"
      - "market-gateway/MARKET-DATA-COMPLIANCE.md"
      - "market-gateway/test/supabase-deployment.test.js"
      - "market-gateway/lib/paper-limit-worker.js"
      - "market-gateway/lib/paper-intraday-limit-worker.js"
      - "market-gateway/test/paper-intraday-limit-worker.test.js"
      - "market-gateway/lib/exchange-session-calendar.js"
      - "market-gateway/test/exchange-session-calendar.test.js"
      - "market-gateway/test/exchange-session-import.test.js"
      - "market-gateway/test/intraday-limit-policy.test.js"
      - "market-gateway/test/paper-limit-worker.test.js"
      - "market-gateway/lib/intraday-limit-policy.js"
      - "market-gateway/test/intraday-limit-policy.test.js"
      - "market-gateway/lib/protective-order-worker.js"
      - "market-gateway/test/protective-order-worker.test.js"
      - "market-gateway/test/paper-limit-worker.test.js"
      - "market-gateway/paper-limit-worker.js"
      - "market-gateway/lib/bse-equity-fee-master.js"
      - "market-gateway/test/bse-equity-fee-master.test.js"
      - "market-gateway/scripts/import-bse-scrip-master.js"
      - "market-gateway/lib/exchange-session-import.js"
      - "market-gateway/test/exchange-session-import.test.js"
      - "market-gateway/scripts/import-exchange-sessions.js"
      - "market-gateway/test/trading-charges.test.js"
      - "market-gateway/test/derivative-order-transaction.test.js"
      - "market-gateway/test/derivative-contract.test.js"
      - "market-gateway/lib/derivative-limit-quote-policy.js"
      - "market-gateway/test/derivative-limit-quote-policy.test.js"
      - "market-gateway/lib/upstox-executable-quote.js"
      - "market-gateway/test/upstox-executable-quote.test.js"
      - "supabase/tests/**"
      - "supabase/tests/protective_order_cancel.sql"
      - "market-gateway/lib/**"
      - "market-gateway/test/**"
      - "market-gateway/supabase-server.js"
      - "supabase/**"
  push:
    branches:
      - integration/supabase-native-auth-professional-launch-2026-11-22

  workflow_dispatch:

concurrency:
  group: paper-trading-supabase-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_trading_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Firebase Functions Node 22 runtime and dependency compatibility
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('functions/package.json', 'utf8'));
          const deploy = fs.readFileSync('.github/workflows/deploy-firebase-functions.yml', 'utf8');
          if (firebase.functions?.find(item => item.source === 'functions')?.runtime !== 'nodejs22') throw new Error('firebase.json must use nodejs22');
          if (pkg.engines?.node !== '22') throw new Error('functions/package.json must require Node 22');
          if (!/node-version:\s*["']22["']/.test(deploy)) throw new Error('Firebase deploy workflow must use Node 22');
          console.log('Firebase runtime, package engine and deploy workflow all target Node 22.');
          NODE
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          npm audit --prefix functions --omit=dev
          node --check functions/index.js
          node --check functions/kirana.js
          node --check functions/kirana-ledger.js
      - name: Check native Supabase Auth browser modules
        run: |
          node --input-type=module --check < markets/stocks/supabase-client.js
          node --input-type=module --check < markets/stocks/connect.js
          node --input-type=module --check < markets/stocks/email-auth.js
          node --check markets/stocks/stocks.js
          node --check markets/language-toggle.js
          if grep -Eiq 'firebase-client|firebase-auth|firebase-functions' markets/stocks/supabase-client.js markets/stocks/connect.js markets/stocks/email-auth.js; then
            echo "Firebase authentication dependency remains in the new market app."
            exit 1
          fi
      - name: Check installable market PWA and service worker
        run: node --check markets/service-worker.js
      - name: Run account and session isolation regression tests
        run: node --test markets/stocks/connect-session-isolation.test.js
      - name: Validate manual Supabase gateway deployment workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/deploy-supabase-market-gateway.yml")'
      - name: Check professional chart engine and indicator calculations
        run: |
          node --check markets/stocks/chart-engine.js
          node --check markets/stocks/chart-indicators.js
          node --test markets/stocks/chart-indicators.test.js
      - name: Verify Supabase-only Cloud Run entrypoint and production dependency boundary
        run: node --test market-gateway/test/supabase-deployment.test.js
      - name: Check Indian-market Intraday LIMIT session and expiry policy
        run: |
          node --check market-gateway/lib/intraday-limit-policy.js
          node --test market-gateway/test/intraday-limit-policy.test.js
      - name: Check Supabase LIMIT worker eligibility and cursor safety
        run: |
          node --check market-gateway/paper-limit-worker.js
          node --test market-gateway/test/paper-limit-worker.test.js
          node --check market-gateway/lib/protective-order-worker.js
          node --test market-gateway/test/protective-order-worker.test.js
          node --check market-gateway/lib/paper-protective-worker.js
          node --test market-gateway/test/paper-protective-worker.test.js
      - name: Build production gateway image and verify Firebase is absent
        run: |
          set -euo pipefail
          docker build --pull -f market-gateway/Dockerfile -t zenura-market-gateway:ci .
          docker run --rm --entrypoint node zenura-market-gateway:ci -e '
            const p=require("./package.json");
            if(p.main!=="supabase-server.js") throw new Error("Wrong default gateway entrypoint");
            for(const name of ["firebase-admin","@google-cloud/firestore"]) {
              try { require.resolve(name); throw new Error("Legacy Firebase package leaked into production image: "+name); }
              catch(error) { if(error.message.startsWith("Legacy Firebase package")) throw error; }
            }
          '
      - name: Check Supabase-native gateway and token security
        run: |
          node --check market-gateway/lib/supabase-runtime.js
          node --check market-gateway/supabase-server.js
          node --check market-gateway/lib/upstox-token-crypto.js
          node --test market-gateway/test/supabase-runtime.test.js market-gateway/test/upstox-token-crypto.test.js
      - name: Build Supabase-native Cloud Run container from repository root
        run: docker build --pull -f market-gateway/Dockerfile -t zenura-market-gateway:ci .
      - name: Run Existing transaction reference charge-calculation boundary tests
        run: node --test market-gateway/test/trading-charges.test.js
      - name: Run Existing transaction reference option transaction tests
        run: node --test market-gateway/test/derivative-order-transaction.test.js
      - name: Run Existing transaction reference derivative contract validation tests
        run: node --test market-gateway/test/derivative-contract.test.js
      - name: Run complete market-gateway regression suite
        run: |
          npm install --prefix market-gateway --no-audit --no-fund --package-lock=false
          npm test --prefix market-gateway
      - name: Prepare minimal Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          -- Minimal Supabase Auth fixture: application users are native auth.users rows.
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $uid$
            SELECT NULLIF(COALESCE(
              current_setting('request.jwt.claim.sub', true),
              (NULLIF(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
            ), '')::uuid
          $uid$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          CREATE FUNCTION public.rls_auto_enable()
          RETURNS event_trigger
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog
          AS $fixture$
          BEGIN
            RETURN;
          END
          $fixture$;
          GRANT EXECUTE ON FUNCTION public.rls_auto_enable() TO PUBLIC;
          SQL
      - name: Check protective reservation migration orphan preflight contract
        run: node --test supabase/tests/protective_reservation_migration_preflight.test.js
      - name: Apply ordered draft migrations to disposable PostgreSQL
        run: |
          set -euo pipefail
          applied_count=0
          for migration in supabase/migrations/*.sql; do
            # The hosted project records exactly the first 15 migrations through
            # 20261122123415. Build that baseline, seed legacy persisted MARKET
            # rows, then exercise every pending migration as a forward upgrade.
            if [[ "$migration" == "supabase/migrations/20261122124500_retire_paper_investing.sql" ]]; then
              if [[ "$applied_count" -ne 15 ]]; then
                echo "Expected the hosted 15-migration baseline, found $applied_count" >&2
                exit 1
              fi
              psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted_upgrade_seed.sql
            fi
            if [[ "$migration" == "supabase/migrations/20261122153000_reserve_equity_protective_exit_shares.sql" ]]; then
              bash supabase/tests/protective_reservation_orphan_migration.sh "$migration"
            fi
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
            applied_count=$((applied_count + 1))
          done
          if [[ "$applied_count" -ne 46 ]]; then
            echo "Expected 46 candidate migrations, found $applied_count" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -f supabase/tests/protective_reservation_backfill_assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted_upgrade_assertions.sql
      - name: Verify least-privilege Supabase market gateway service-role grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/market_gateway_service_role_grants.sql
      - name: Verify distributed per-user API rate-limit budgets and RPC isolation
        run: |
          node --check market-gateway/lib/api-rate-limit.js
          node --check market-gateway/test/api-rate-limit.test.js
          node --test market-gateway/test/api-rate-limit.test.js
          psql -v ON_ERROR_STOP=1 -f supabase/tests/paper_api_rate_limits.sql
      - name: Exercise concurrent distributed API rate-limit requests
        run: bash supabase/tests/paper_api_rate_limit_concurrency.sh
      - name: Reconcile Indian-market Futures ledger cash, charges, realized P&L and margin
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/futures_market_order_accounting.sql
      - name: Verify terminal legacy Futures MARKET rows never retain a LIMIT remainder
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/futures_legacy_market_backfill.sql
      - name: Exercise atomic Futures LIMIT submit, reservation, cancel and expiry
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/futures_limit_submit_release.sql
      - name: Exercise atomic Futures LIMIT partial fills and settlement conservation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/futures_limit_atomic_fill.sql
      - name: Exercise concurrent Futures LIMIT fill, cancel and duplicate execution races
        run: bash supabase/tests/futures_limit_fill_cancel_race.sh
      - name: Reconcile Indian-market long Options ledger cash, charges and realized P&L
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/long_option_ledger_reconciliation.sql
      - name: Exercise atomic NSE Options LIMIT submit, cash/close reservation, cancel and expiry
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/options_limit_submit_release.sql
      - name: Exercise atomic NSE Options LIMIT partial/full fill accounting and reservation settlement
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/options_limit_atomic_fill.sql
      - name: Exercise concurrent NSE Options LIMIT fill, cancel and duplicate execution races
        run: bash supabase/tests/options_limit_fill_cancel_race.sh
      - name: Verify F&O LIMIT schema remains fail-closed until lifecycle release
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/derivative_limit_schema_guard.sql
      - name: Verify isolated NSE Options LIMIT schema, RLS and MARKET SELL reservation guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/options_limit_schema.sql
      - name: Verify long Options coexist with reserved Futures margin
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/option_buy_with_futures_margin.sql
      - name: Exercise BSE scrip master import and group-specific fee rules
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bse_equity_fee_master.sql
      - name: Verify BSE protective SELL fee-aware settlement and ledger reconciliation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/protective_sell_bse_charges.sql
      - name: Exercise verified NSE and BSE session calendar imports
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/exchange_session_import.sql
      - name: Verify Supabase market worker single-writer lease and expiry
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $worker_lease$
          DECLARE
            v_now bigint:=floor(extract(epoch from clock_timestamp())*1000)::bigint;
            v_a uuid:='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            v_b uuid:='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
            v_result boolean;
          BEGIN
            SELECT public.acquire_paper_market_worker_lease('paper_limit_orders',v_a,v_now,240000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'First worker lease was not acquired'; END IF;
            SELECT public.acquire_paper_market_worker_lease('paper_limit_orders',v_b,v_now+1000,240000) INTO v_result;
            IF v_result IS NOT FALSE THEN RAISE EXCEPTION 'Concurrent worker lease was unexpectedly acquired'; END IF;
            SELECT public.release_paper_market_worker_lease('paper_limit_orders',v_a,v_now+2000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'Worker lease was not released'; END IF;
            SELECT public.acquire_paper_market_worker_lease('paper_limit_orders',v_b,v_now+3000,120000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'Next worker did not acquire released lease'; END IF;
            SELECT public.acquire_paper_market_worker_lease('paper_limit_orders',v_a,v_now+244000,120000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'Expired worker lease was not recoverable'; END IF;
            PERFORM public.release_paper_market_worker_lease('paper_limit_orders',v_a,v_now+245000);
            SELECT public.acquire_paper_market_worker_lease('paper_protective_orders',v_a,v_now+246000,240000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'Protective worker lease was not acquired'; END IF;
            SELECT public.acquire_paper_market_worker_lease('paper_protective_orders',v_b,v_now+247000,240000) INTO v_result;
            IF v_result IS NOT FALSE THEN RAISE EXCEPTION 'Second protective worker acquired the same lease'; END IF;
            SELECT public.acquire_paper_market_worker_lease('paper_limit_orders',v_b,v_now+248000,240000) INTO v_result;
            IF v_result IS NOT TRUE THEN RAISE EXCEPTION 'Independent LIMIT lease was blocked by protective worker'; END IF;
            PERFORM public.release_paper_market_worker_lease('paper_protective_orders',v_a,v_now+249000);
            PERFORM public.release_paper_market_worker_lease('paper_limit_orders',v_b,v_now+249000);
          END
          $worker_lease$;
          SQL
      - name: Reject non-finite option strike prices
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $strike_guard$
          DECLARE
            v_strike numeric;
            v_rejected boolean;
          BEGIN
            FOREACH v_strike IN ARRAY ARRAY[
              'NaN'::numeric, 'Infinity'::numeric, '-Infinity'::numeric
            ] LOOP
              v_rejected := false;
              BEGIN
                PERFORM public.execute_paper_long_option_order(
                  '22222222-2222-4222-8222-222222222222',
                  repeat('a',64),
                  'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                  repeat('b',64),
                  'NSE_FO|STRIKE_TEST','STRIKE_TEST','NSE','NSE_FO','CE',
                  current_date+5,v_strike,25,5,1,'BUY',100,
                  floor(extract(epoch from clock_timestamp())*1000)::bigint,
                  floor(extract(epoch from clock_timestamp())*1000)::bigint
                );
              EXCEPTION WHEN SQLSTATE '22023' THEN
                v_rejected := true;
              END;
              IF NOT v_rejected THEN
                RAISE EXCEPTION 'Non-finite option strike was accepted: %', v_strike;
              END IF;
            END LOOP;
          END
          $strike_guard$;
          SQL
      - name: Exercise account initialization and account read isolation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444'),
            ('55555555-5555-4555-8555-555555555555'),
            ('66666666-6666-4666-8666-666666666666'),
            ('77777777-7777-4777-8777-777777777777'),
            ('88888888-8888-4888-8888-888888888888'),
            ('99999999-9999-4999-8999-999999999999'),
            ('12121212-1212-4212-8212-121212121212');
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          SELECT public.initialize_paper_trading_account('22222222-2222-4222-8222-222222222222');
          RESET ROLE;
          UPDATE public.paper_accounts
             SET cash_paise=76543210, reserved_cash_paise=100
           WHERE user_id='11111111-1111-4111-8111-111111111111';
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          RESET ROLE;
          DO $account_retry_checks$
          BEGIN
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 76543210 THEN
              RAISE EXCEPTION 'Account retry reset an existing cash balance';
            END IF;
            IF (SELECT reserved_cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 100 THEN
              RAISE EXCEPTION 'Account retry reset an existing reservation';
            END IF;
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='22222222-2222-4222-8222-222222222222') <> 100000000 THEN
              RAISE EXCEPTION 'New account did not receive the expected 10 lakh virtual capital';
            END IF;
          END
          $account_retry_checks$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claims','{"sub":"11111111-1111-4111-8111-111111111111","role":"authenticated"}',false);
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.paper_accounts) <> 1 THEN
              RAISE EXCEPTION 'Authenticated user can see another user account or cannot see own account';
            END IF;
          END
          $$;
          RESET ROLE;
          SQL
      - name: Verify Intraday LIMIT worker lease registration and single-writer isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/intraday_limit_worker_lease.sql
      - name: Exercise Intraday LIMIT reservation, cancellation and session expiry
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/intraday_limit_reservations.sql
      - name: Exercise concurrent Intraday LIMIT fill versus cancel row-lock races
        run: bash supabase/tests/intraday_limit_fill_cancel_race.sh
      - name: Verify authenticated table grants and RLS watchlist isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_permissions.sql
      - name: Exercise fee-inclusive atomic NSE equity MARKET settlement
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/equity_market_fee_settlement.sql
      - name: Exercise MARKET idempotency and LIMIT reservation lifecycle
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_result jsonb;
            v_cash bigint;
            v_reserved bigint;
            v_qty integer;
            v_replay boolean;
          BEGIN
            -- MARKET BUY: 10 shares at ₹100; retry must not debit twice.
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('a',64),
              '33333333-3333-4333-8333-333333333333',
              repeat('b',64),'NSE_EQ|TEST001','TEST001','NSE',
              'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            IF v_result->>'status' <> 'FILLED'
               OR (v_result->>'cash_paise')::bigint <> 99897521 THEN
              RAISE EXCEPTION 'MARKET BUY did not debit gross plus estimated charges';
            END IF;
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('a',64),
              '33333333-3333-4333-8333-333333333333',
              repeat('b',64),'NSE_EQ|TEST001','TEST001','NSE',
              'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            IF (v_result->>'idempotent_replay')::boolean IS NOT TRUE THEN
              RAISE EXCEPTION 'MARKET retry was not idempotent';
            END IF;
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_cash <> 99897521 THEN
              RAISE EXCEPTION 'MARKET idempotent retry debited cash more than once';
            END IF;
            -- Same key with a different fingerprint must fail.
            BEGIN
              PERFORM public.execute_paper_market_order(
                '22222222-2222-4222-8222-222222222222',
                repeat('c',64),
                '33333333-3333-4333-8333-333333333333',
                repeat('d',64),'NSE_EQ|TEST001','TEST001','NSE',
                'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
              );
              RAISE EXCEPTION 'Changed MARKET fingerprint was unexpectedly accepted';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;
            -- SELL half the position: ₹10,000 gross spread; charges reduce net realized P&L, five shares remain.
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('e',64),
              '44444444-4444-4444-8444-444444444444',
              repeat('f',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL','DELIVERY',5,12000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            SELECT quantity INTO v_qty FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR (v_result->>'order_realized_pnl_paise')::bigint <> 3978 THEN
              RAISE EXCEPTION 'MARKET SELL net realized P&L or position is incorrect';
            END IF;
            BEGIN
              PERFORM public.submit_paper_limit_order(
                '22222222-2222-4222-8222-222222222222',repeat('9',64),
                '99999999-9999-4999-8999-999999999999',repeat('a',64),
                'BSE_EQ|LIMIT_BSE_BLOCK','LIMIT_BSE_BLOCK','BSE','BUY',1,10000
              );
              RAISE EXCEPTION 'BSE Delivery LIMIT was accepted without scrip-group fee inputs';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            -- Reject a LIMIT SELL whose minimum charges exceed gross proceeds.
            BEGIN
              PERFORM public.submit_paper_limit_order(
                '22222222-2222-4222-8222-222222222222',repeat('b',64),
                'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',repeat('c',64),
                'NSE_EQ|TEST001','TEST001','NSE','SELL',1,1
              );
              RAISE EXCEPTION 'Tiny Delivery LIMIT SELL with negative net proceeds was accepted';
            EXCEPTION WHEN SQLSTATE '22003' THEN
              NULL;
            END;
            IF EXISTS(SELECT 1 FROM public.paper_orders
              WHERE order_id='eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee') THEN
              RAISE EXCEPTION 'Rejected tiny Delivery LIMIT SELL left a persisted order row';
            END IF;
            -- LIMIT BUY reservation then cancellation must release all reserved cash.
            v_result := public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('1',64),
              '55555555-5555-4555-8555-555555555555',
              repeat('2',64),'NSE_EQ|TEST002','TEST002','NSE',
              'BUY',2,20000
            );
            SELECT reserved_cash_paise INTO v_reserved FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_reserved <> 42407 THEN
              RAISE EXCEPTION 'LIMIT BUY did not reserve expected cash';
            END IF;
            PERFORM public.cancel_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',repeat('1',64)
            );
            SELECT reserved_cash_paise INTO v_reserved FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_reserved <> 0 THEN
              RAISE EXCEPTION 'LIMIT BUY cancellation did not release reservation';
            END IF;
            -- LIMIT BUY fill at a better price releases reservation and debits actual fill.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('3',64),
              '66666666-6666-4666-8666-666666666666',
              repeat('4',64),'NSE_EQ|TEST003','TEST003','NSE',
              'BUY',2,30000
            );
            v_result := public.execute_paper_limit_fill(
              repeat('3',64),29000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            SELECT reserved_cash_paise,cash_paise INTO v_reserved,v_cash
              FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_result->>'status' <> 'FILLED' OR v_reserved <> 0 OR v_cash <> 99892310
               OR (v_result->>'charges_paise')::bigint <> 2429
               OR (v_result->>'cash_delta_paise')::bigint <> -60429 THEN
              RAISE EXCEPTION 'LIMIT BUY fill cash or reservation result is incorrect after fee-inclusive MARKET basis';
            END IF;
            -- LIMIT SELL must reserve shares, reject stale quotes, and release on cancel.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('5',64),
              '77777777-7777-4777-8777-777777777777',
              repeat('6',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL',2,12500
            );
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR v_reserved <> 2 THEN
              RAISE EXCEPTION 'LIMIT SELL did not reserve the expected shares';
            END IF;
            BEGIN
              PERFORM public.execute_paper_limit_fill(repeat('5',64),13000,floor(extract(epoch from clock_timestamp())*1000)::bigint-15001,15001,floor(extract(epoch from clock_timestamp())*1000)::bigint);
              RAISE EXCEPTION 'Stale LIMIT quote was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN
              NULL;
            END;
            PERFORM public.cancel_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',repeat('5',64)
            );
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR v_reserved <> 0 THEN
              RAISE EXCEPTION 'LIMIT SELL cancellation did not release reserved shares';
            END IF;
            -- A second LIMIT SELL fills at a better price and realizes allocated gain.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('7',64),
              '88888888-8888-4888-8888-888888888888',
              repeat('8',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL',2,12500
            );
            v_result := public.execute_paper_limit_fill(repeat('7',64),13000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0,floor(extract(epoch from clock_timestamp())*1000)::bigint);
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_result->>'status' <> 'FILLED' OR v_qty <> 3 OR v_reserved <> 0
               OR v_cash <> 99913563
               OR (v_result->>'charges_paise')::bigint <> 4747
               OR (v_result->>'cash_delta_paise')::bigint <> 21253
               OR (v_result->>'realized_pnl_paise')::bigint <> 757 THEN
              RAISE EXCEPTION 'LIMIT SELL fill position, cash, reservation or fee-inclusive basis P&L is incorrect';
            END IF;
          END
          $$;
          RESET ROLE;
