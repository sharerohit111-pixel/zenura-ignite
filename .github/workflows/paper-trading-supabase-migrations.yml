name: Paper Trading Supabase SQL smoke test

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/paper-trading-supabase-migrations.yml"
  workflow_dispatch:

jobs:
  postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_trading_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          SQL
      - name: Apply ordered draft migrations to disposable PostgreSQL
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Exercise account initialization and account read isolation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222');
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          SELECT public.initialize_paper_trading_account('22222222-2222-4222-8222-222222222222');
          RESET ROLE;
          UPDATE public.paper_accounts
             SET cash_paise=76543210, reserved_cash_paise=100
           WHERE user_id='11111111-1111-4111-8111-111111111111';
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('11111111-1111-4111-8111-111111111111');
          RESET ROLE;
          DO $$
          BEGIN
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 76543210 THEN
              RAISE EXCEPTION 'Account retry reset an existing cash balance';
            END IF;
            IF (SELECT reserved_cash_paise FROM public.paper_accounts
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 100 THEN
              RAISE EXCEPTION 'Account retry reset an existing reservation';
            END IF;
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='22222222-2222-4222-8222-222222222222') <> 100000000 THEN
              RAISE EXCEPTION 'New account did not receive the expected 10 lakh virtual capital';
            END IF;
          END
          $$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.paper_accounts) <> 1 THEN
              RAISE EXCEPTION 'Authenticated user can see another user account or cannot see own account';
            END IF;
          END
          $$;
          RESET ROLE;
          SQL
      - name: Exercise MARKET idempotency and LIMIT reservation lifecycle
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_result jsonb;
            v_cash bigint;
            v_reserved bigint;
            v_qty integer;
            v_replay boolean;
          BEGIN
            -- MARKET BUY: 10 shares at ₹100; retry must not debit twice.
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('a',64),
              '33333333-3333-4333-8333-333333333333',
              repeat('b',64),'NSE_EQ|TEST001','TEST001','NSE',
              'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            IF v_result->>'status' <> 'FILLED'
               OR (v_result->>'cash_paise')::bigint <> 99900000 THEN
              RAISE EXCEPTION 'MARKET BUY did not debit expected gross amount';
            END IF;
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('a',64),
              '33333333-3333-4333-8333-333333333333',
              repeat('b',64),'NSE_EQ|TEST001','TEST001','NSE',
              'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            IF (v_result->>'idempotent_replay')::boolean IS NOT TRUE THEN
              RAISE EXCEPTION 'MARKET retry was not idempotent';
            END IF;
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_cash <> 99900000 THEN
              RAISE EXCEPTION 'MARKET idempotent retry debited cash more than once';
            END IF;
            -- Same key with a different fingerprint must fail.
            BEGIN
              PERFORM public.execute_paper_market_order(
                '22222222-2222-4222-8222-222222222222',
                repeat('c',64),
                '33333333-3333-4333-8333-333333333333',
                repeat('d',64),'NSE_EQ|TEST001','TEST001','NSE',
                'BUY','DELIVERY',10,10000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
              );
              RAISE EXCEPTION 'Changed MARKET fingerprint was unexpectedly accepted';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;
            -- SELL half the position: ₹10,000 realized gain, five shares remain.
            v_result := public.execute_paper_market_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('e',64),
              '44444444-4444-4444-8444-444444444444',
              repeat('f',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL','DELIVERY',5,12000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0
            );
            SELECT quantity INTO v_qty FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR (v_result->>'order_realized_pnl_paise')::bigint <> 10000 THEN
              RAISE EXCEPTION 'MARKET SELL position or realized P&L is incorrect';
            END IF;
            -- LIMIT BUY reservation then cancellation must release all reserved cash.
            v_result := public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('1',64),
              '55555555-5555-4555-8555-555555555555',
              repeat('2',64),'NSE_EQ|TEST002','TEST002','NSE',
              'BUY',2,20000
            );
            SELECT reserved_cash_paise INTO v_reserved FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_reserved <> 40000 THEN
              RAISE EXCEPTION 'LIMIT BUY did not reserve expected cash';
            END IF;
            PERFORM public.cancel_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',repeat('1',64)
            );
            SELECT reserved_cash_paise INTO v_reserved FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_reserved <> 0 THEN
              RAISE EXCEPTION 'LIMIT BUY cancellation did not release reservation';
            END IF;
            -- LIMIT BUY fill at a better price releases reservation and debits actual fill.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('3',64),
              '66666666-6666-4666-8666-666666666666',
              repeat('4',64),'NSE_EQ|TEST003','TEST003','NSE',
              'BUY',2,30000
            );
            v_result := public.execute_paper_limit_fill(
              repeat('3',64),29000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            SELECT reserved_cash_paise,cash_paise INTO v_reserved,v_cash
              FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_result->>'status' <> 'FILLED' OR v_reserved <> 0 OR v_cash <> 99902000 THEN
              RAISE EXCEPTION 'LIMIT BUY fill cash or reservation result is incorrect';
            END IF;
            -- LIMIT SELL must reserve shares, reject stale quotes, and release on cancel.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('5',64),
              '77777777-7777-4777-8777-777777777777',
              repeat('6',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL',2,12500
            );
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR v_reserved <> 2 THEN
              RAISE EXCEPTION 'LIMIT SELL did not reserve the expected shares';
            END IF;
            BEGIN
              PERFORM public.execute_paper_limit_fill(repeat('5',64),13000,floor(extract(epoch from clock_timestamp())*1000)::bigint-15001,15001,floor(extract(epoch from clock_timestamp())*1000)::bigint);
              RAISE EXCEPTION 'Stale LIMIT quote was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN
              NULL;
            END;
            PERFORM public.cancel_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',repeat('5',64)
            );
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            IF v_qty <> 5 OR v_reserved <> 0 THEN
              RAISE EXCEPTION 'LIMIT SELL cancellation did not release reserved shares';
            END IF;
            -- A second LIMIT SELL fills at a better price and realizes allocated gain.
            PERFORM public.submit_paper_limit_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('7',64),
              '88888888-8888-4888-8888-888888888888',
              repeat('8',64),'NSE_EQ|TEST001','TEST001','NSE',
              'SELL',2,12500
            );
            v_result := public.execute_paper_limit_fill(repeat('7',64),13000,floor(extract(epoch from clock_timestamp())*1000)::bigint,0,floor(extract(epoch from clock_timestamp())*1000)::bigint);
            SELECT quantity,reserved_quantity INTO v_qty,v_reserved
              FROM public.paper_equity_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND product='DELIVERY' AND instrument_key='NSE_EQ|TEST001';
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_result->>'status' <> 'FILLED' OR v_qty <> 3 OR v_reserved <> 0
               OR v_cash <> 99928000
               OR (v_result->>'realized_pnl_paise')::bigint <> 6000 THEN
              RAISE EXCEPTION 'LIMIT SELL fill position, cash, reservation or P&L is incorrect';
            END IF;
          END
          $$;
          RESET ROLE;
          SQL
      - name: Reject stale, future and caller-age-mismatched MARKET quotes
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_now bigint := floor(extract(epoch from clock_timestamp())*1000)::bigint;
          BEGIN
            BEGIN
              PERFORM public.execute_paper_market_order(
                '22222222-2222-4222-8222-222222222222',repeat('a',64),
                '12121212-1212-4212-8212-121212121212',repeat('b',64),
                'NSE_EQ|FUTURE','FUTURE','NSE','BUY','DELIVERY',1,10000,v_now+10000,0
              );
              RAISE EXCEPTION 'Future MARKET quote was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            BEGIN
              PERFORM public.execute_paper_market_order(
                '22222222-2222-4222-8222-222222222222',repeat('c',64),
                '13131313-1313-4313-8313-131313131313',repeat('d',64),
                'NSE_EQ|STALE','STALE','NSE','BUY','DELIVERY',1,10000,v_now-16000,16000
              );
              RAISE EXCEPTION 'Stale MARKET quote was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            BEGIN
              PERFORM public.execute_paper_market_order(
                '22222222-2222-4222-8222-222222222222',repeat('e',64),
                '14141414-1414-4414-8414-141414141414',repeat('f',64),
                'NSE_EQ|AGE','AGE','NSE','BUY','DELIVERY',1,10000,v_now,9000
              );
              RAISE EXCEPTION 'Caller-supplied MARKET quote age mismatch was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
          END
          $$;
          SQL
      - name: Exercise concurrent duplicate MARKET requests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES ('33333333-3333-4333-8333-333333333333')
            ON CONFLICT DO NOTHING;
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('33333333-3333-4333-8333-333333333333');
          RESET ROLE;
          SQL
          run_duplicate() {
            psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.execute_paper_market_order(
            '33333333-3333-4333-8333-333333333333',repeat('d',64),
            '15151515-1515-4515-8515-151515151515',repeat('e',64),
            'NSE_EQ|RACE','RACE','NSE','BUY','DELIVERY',10,10000,
            floor(extract(epoch from clock_timestamp())*1000)::bigint,0
          );
          RESET ROLE;
          SQL
          }
          run_duplicate & pid1=$!
          run_duplicate & pid2=$!
          wait "$pid1"
          wait "$pid2"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.paper_orders
                WHERE user_id='33333333-3333-4333-8333-333333333333'
                  AND idempotency_key='15151515-1515-4515-8515-151515151515') <> 1 THEN
              RAISE EXCEPTION 'Concurrent duplicate MARKET requests created more than one order';
            END IF;
            IF (SELECT cash_paise FROM public.paper_accounts
                WHERE user_id='33333333-3333-4333-8333-333333333333') <> 99900000 THEN
              RAISE EXCEPTION 'Concurrent duplicate MARKET requests debited cash more than once';
            END IF;
          END
          $$;
          SQL
      - name: Exercise concurrent LIMIT duplicate submit and fill-cancel race
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES ('44444444-4444-4444-8444-444444444444')
            ON CONFLICT DO NOTHING;
          SET ROLE service_role;
          SELECT public.initialize_paper_trading_account('44444444-4444-4444-8444-444444444444');
          RESET ROLE;
          SQL
          run_submit() {
            psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          SELECT public.submit_paper_limit_order(
            '44444444-4444-4444-8444-444444444444',repeat('8',64),
            '17171717-1717-4717-8717-171717171717',repeat('2',64),
            'NSE_EQ|LIMITRACE','LIMITRACE','NSE','BUY',5,10000
          );
          RESET ROLE;
          SQL
          }
          run_submit & pid1=$!
          run_submit & pid2=$!
          wait "$pid1"
          wait "$pid2"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.paper_orders
                WHERE user_id='44444444-4444-4444-8444-444444444444'
                  AND idempotency_key='17171717-1717-4717-8717-171717171717') <> 1
               OR (SELECT reserved_cash_paise FROM public.paper_accounts
                WHERE user_id='44444444-4444-4444-8444-444444444444') <> 50000 THEN
              RAISE EXCEPTION 'Concurrent LIMIT duplicate submit created duplicate reservation/order';
            END IF;
            BEGIN
              PERFORM public.submit_paper_limit_order(
                '44444444-4444-4444-8444-444444444444',repeat('8',64),
                '17171717-1717-4717-8717-171717171717',repeat('3',64),
                'NSE_EQ|LIMITRACE','LIMITRACE','NSE','BUY',5,10000
              );
              RAISE EXCEPTION 'LIMIT idempotency key accepted a changed fingerprint';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END
          $$;
          SQL
          run_fill() {
            psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          DO $$
          BEGIN
            BEGIN
              PERFORM public.execute_paper_limit_fill(
                repeat('8',64),10000,
                floor(extract(epoch from clock_timestamp())*1000)::bigint,0,
                floor(extract(epoch from clock_timestamp())*1000)::bigint
              );
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END
          $$;
          RESET ROLE;
          SQL
          }
          run_cancel() {
            psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          DO $$
          BEGIN
            BEGIN
              PERFORM public.cancel_paper_limit_order(
                '44444444-4444-4444-8444-444444444444',repeat('8',64)
              );
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END
          $$;
          RESET ROLE;
          SQL
          }
          run_fill & pid3=$!
          run_cancel & pid4=$!
          wait "$pid3"
          wait "$pid4"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_status text;
            v_cash bigint;
            v_reserved bigint;
          BEGIN
            SELECT status INTO v_status FROM public.paper_orders
             WHERE order_id=repeat('8',64);
            SELECT cash_paise,reserved_cash_paise INTO v_cash,v_reserved
             FROM public.paper_accounts
             WHERE user_id='44444444-4444-4444-8444-444444444444';
            IF v_status NOT IN ('FILLED','CANCELLED') OR v_reserved<>0 THEN
              RAISE EXCEPTION 'LIMIT fill/cancel race left a non-terminal order or leaked reservation';
            END IF;
            IF (v_status='FILLED' AND v_cash<>99950000)
               OR (v_status='CANCELLED' AND v_cash<>100000000) THEN
              RAISE EXCEPTION 'LIMIT fill/cancel race produced inconsistent cash';
            END IF;
          END
          $$;
          SQL
      - name: Reject null LIMIT side before any reservation or order write
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            BEGIN
              PERFORM public.submit_paper_limit_order(
                '22222222-2222-4222-8222-222222222222',
                repeat('0',64),'16161616-1616-4616-8616-161616161616',
                repeat('b',64),'NSE_EQ|NULLSIDE','NULLSIDE','NSE',NULL,1,10000
              );
              RAISE EXCEPTION 'NULL LIMIT side was accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN NULL;
            END;
            IF EXISTS (SELECT 1 FROM public.paper_orders WHERE order_id=repeat('0',64)) THEN
              RAISE EXCEPTION 'Rejected NULL LIMIT side left an order row behind';
            END IF;
          END
          $$;
          SQL
      - name: Exercise long option transactions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_result jsonb;
            v_cash bigint;
            v_qty bigint;
            v_basis bigint;
            v_avg bigint;
            v_realized bigint;
          BEGIN
            -- The preceding step leaves ₹99,928,000 cash after the LIMIT SELL fill.
            -- Long CE BUY: 2 lots × 25, ₹12.85 premium. Fee-inclusive cost basis.
            v_result := public.execute_paper_long_option_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('9',64),'99999999-9999-4999-8999-999999999999',
              repeat('a',64),'NSE_FO|TESTCE','TESTCE','NSE','NSE_FO','CE',
              current_date + 10,22000,25,5,2,'BUY',1285,floor(extract(epoch from clock_timestamp())*1000)::bigint,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            SELECT cash_paise INTO v_cash FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            SELECT net_quantity,cost_basis_paise,average_price_paise
              INTO v_qty,v_basis,v_avg FROM public.paper_derivative_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND instrument_key='NSE_FO|TESTCE';
            IF v_qty <> 50 OR v_basis <> 66639 OR v_avg <> 1333
               OR v_cash <> 99861361
               OR (v_result->>'idempotent_replay')::boolean IS NOT FALSE THEN
              RAISE EXCEPTION 'Long CE BUY quantity, fee-inclusive basis, average or cash is incorrect';
            END IF;
            -- Retry must not execute or charge a second time.
            v_result := public.execute_paper_long_option_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('9',64),'99999999-9999-4999-8999-999999999999',
              repeat('a',64),'NSE_FO|TESTCE','TESTCE','NSE','NSE_FO','CE',
              current_date + 10,22000,25,5,2,'BUY',1285,floor(extract(epoch from clock_timestamp())*1000)::bigint,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            IF (v_result->>'idempotent_replay')::boolean IS NOT TRUE THEN
              RAISE EXCEPTION 'Long option retry was not idempotent';
            END IF;
            -- Partial close one lot; remaining cost basis is conserved.
            v_result := public.execute_paper_long_option_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('b',64),'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              repeat('c',64),'NSE_FO|TESTCE','TESTCE','NSE','NSE_FO','CE',
              current_date + 10,22000,25,5,1,'SELL',1500,floor(extract(epoch from clock_timestamp())*1000)::bigint,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            SELECT net_quantity,cost_basis_paise,average_price_paise
              INTO v_qty,v_basis,v_avg FROM public.paper_derivative_positions
             WHERE user_id='22222222-2222-4222-8222-222222222222'
               AND instrument_key='NSE_FO|TESTCE';
            SELECT cash_paise,realized_pnl_paise INTO v_cash,v_realized
              FROM public.paper_accounts
             WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF v_qty <> 25 OR v_basis <> 33319 OR v_avg <> 1333
               OR (v_result->>'realized_pnl_paise')::bigint <> 17749
               OR v_cash <> 99896430 OR v_realized <> 17749 THEN
              RAISE EXCEPTION 'Long option partial close mismatch: qty=%, basis=%, avg=%, order_realized=%, cash=%, account_realized=%', v_qty,v_basis,v_avg,(v_result->>'realized_pnl_paise'),v_cash,v_realized;
            END IF;
            -- Full close at a one-paise premium: charges exceed turnover, so net credit is negative.
            v_result := public.execute_paper_long_option_order(
              '22222222-2222-4222-8222-222222222222',
              repeat('f',64),'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              repeat('d',64),'NSE_FO|TESTCE','TESTCE','NSE','NSE_FO','CE',
              current_date + 10,22000,25,1,1,'SELL',1,floor(extract(epoch from clock_timestamp())*1000)::bigint,floor(extract(epoch from clock_timestamp())*1000)::bigint
            );
            IF (v_result->'order'->>'net_credit_paise')::bigint >= 0
               OR EXISTS (SELECT 1 FROM public.paper_derivative_positions
                 WHERE user_id='22222222-2222-4222-8222-222222222222'
                   AND instrument_key='NSE_FO|TESTCE') THEN
              RAISE EXCEPTION 'Tiny-premium full close did not preserve negative net credit or remove the position';
            END IF;
            -- Stale provider quotes must be rejected before account mutation.
            BEGIN
              PERFORM public.execute_paper_long_option_order(
                '22222222-2222-4222-8222-222222222222',
                repeat('d',64),'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
                repeat('e',64),'NSE_FO|TESTPE','TESTPE','NSE','NSE_FO','PE',
                current_date + 10,22000,25,5,1,'BUY',1285,floor(extract(epoch from clock_timestamp())*1000)::bigint-16001,floor(extract(epoch from clock_timestamp())*1000)::bigint
              );
              RAISE EXCEPTION 'Stale long-option quote was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN
              NULL;
