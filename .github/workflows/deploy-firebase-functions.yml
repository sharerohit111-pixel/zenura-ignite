name: Deploy Firebase Cloud Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/deploy-firebase-functions.yml"

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate Cloud Functions syntax
        working-directory: functions
        run: node --check index.js && node --check kirana.js && node --check kirana-ledger.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions --project zenura-ignite-technologies --non-interactive
