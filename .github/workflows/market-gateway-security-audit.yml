name: Market Gateway Dependency Security Audit

on:
  push:
    branches:
      - feature/s-trade-canonical-demo-integration-2026-11-24
    paths:
      - "market-gateway/package.json"
      - ".github/workflows/market-gateway-security-audit.yml"
  pull_request:
    branches:
      - feature/s-trade-round2-demo-screen-wiring-2026-11-24
    paths:
      - "market-gateway/package.json"
      - ".github/workflows/market-gateway-security-audit.yml"

permissions:
  contents: read

jobs:
  gateway-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared Gateway dependencies
        run: npm install --prefix market-gateway --ignore-scripts --no-audit
      - name: Enforce zero high and critical Gateway advisories
        run: npm audit --prefix market-gateway --audit-level=high
      - name: Verify patched direct dependency versions
        run: |
          node -e "const p=require('./market-gateway/package.json'); if(p.dependencies.express!=='4.22.3'||p.dependencies.protobufjs!=='7.6.6'||p.dependencies.ws!=='8.23.0') process.exit(1); console.log({express:p.dependencies.express,protobufjs:p.dependencies.protobufjs,ws:p.dependencies.ws})"
