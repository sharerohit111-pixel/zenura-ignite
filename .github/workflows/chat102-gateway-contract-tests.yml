name: CHAT 102 Disposable Gateway Contract Tests

on:
  push:
    branches:
      - audit/chat102-gateway-staging-readiness-2026-11-27
    paths:
      - "market-gateway/lib/staging-worker-policy.js"
      - "market-gateway/lib/supabase-readiness.js"
      - "market-gateway/test/supabase-staging-contract.test.js"
      - "market-gateway/test/supabase-readiness.test.js"
      - "market-gateway/supabase-server.js"
      - "market-gateway/lib/supabase-runtime.js"
      - "market-gateway/package.json"
      - "market-gateway/Dockerfile"
      - ".github/workflows/chat102-gateway-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/chat102-gateway-staging-readiness-2026-11-27

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned direct dependencies without writing a lockfile
        working-directory: market-gateway
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run disposable HTTP and staging worker-policy tests
        working-directory: market-gateway
        env:
          NODE_ENV: test
        run: node --test test/supabase-staging-contract.test.js test/supabase-readiness.test.js

      - name: Build disposable gateway image
        working-directory: .
        run: docker build --pull -f market-gateway/Dockerfile -t zenura-gateway-chat102:${GITHUB_SHA} .

      - name: Smoke-test container module loading with disposable config
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://staging-contract.invalid \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_disposable_contract_test \
            -e SUPABASE_SERVICE_ROLE_KEY=disposable-service-role-contract-test \
            --entrypoint node zenura-gateway-chat102:${GITHUB_SHA} \
            -e "const gateway = require('./supabase-server'); if (!gateway.app || typeof gateway.start !== 'function') process.exit(1);"

      - name: Assert this run is restricted to the isolated audit branch
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/audit/chat102-gateway-staging-readiness-2026-11-27"
