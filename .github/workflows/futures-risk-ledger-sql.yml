name: Futures risk ledger SQL integration

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/futures_risk_ledger_settlement_engine.sql"
      - ".github/workflows/futures-risk-ledger-sql.yml"

concurrency:
  group: futures-risk-ledger-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-risk-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_trading_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase Auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(COALESCE(
              current_setting('request.jwt.claim.sub', true),
              (NULLIF(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
            ), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated,service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated,service_role;
          CREATE FUNCTION public.rls_auto_enable() RETURNS event_trigger
          LANGUAGE plpgsql SECURITY DEFINER SET search_path=pg_catalog AS $$
          BEGIN RETURN; END
          $$;
          GRANT EXECUTE ON FUNCTION public.rls_auto_enable() TO PUBLIC;
          SQL
      - name: Apply ordered migrations to disposable PostgreSQL
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run Futures risk, MTM, margin-call, expiry and square-off integration tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/futures_risk_ledger_settlement_engine.sql
