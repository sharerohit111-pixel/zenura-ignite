name: S-TRADE Authenticated Workspace CSP Regression

on:
  pull_request:
    paths:
      - "markets/stocks/index.html"
      - "market-gateway/test/authenticated-workspace-csp.test.cjs"
      - ".github/workflows/s-trade-authenticated-csp.yml"
  push:
    branches:
      - "security/chat53-authenticated-csp-regression-2026-11-25"
    paths:
      - "markets/stocks/index.html"
      - "market-gateway/test/authenticated-workspace-csp.test.cjs"
      - ".github/workflows/s-trade-authenticated-csp.yml"

permissions:
  contents: read

jobs:
  authenticated-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify authenticated workspace CSP
        run: node --test market-gateway/test/authenticated-workspace-csp.test.cjs
