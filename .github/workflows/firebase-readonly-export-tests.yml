name: Firebase read-only export tool tests

on:
  pull_request:
    paths:
      - "market-gateway/scripts/firebase-readonly-export.js"
      - "market-gateway/test/firebase-readonly-export.test.js"
      - "market-gateway/FIREBASE_READONLY_EXPORT.md"\n      - "market-gateway/scripts/firebase-to-supabase-transform.js"\n      - "market-gateway/test/firebase-to-supabase-transform.test.js"\n      - "market-gateway/FIREBASE_TO_SUPABASE_TRANSFORM.md"
      - ".github/workflows/firebase-readonly-export-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-readonly-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check exporter syntax
        working-directory: market-gateway
        run: node --check scripts/firebase-readonly-export.js
      - name: Run exporter tests
        working-directory: market-gateway
        run: node --test test/firebase-readonly-export.test.js
      - name: Check transformer syntax
        working-directory: market-gateway
        run: node --check scripts/firebase-to-supabase-transform.js
      - name: Run transformer tests
        working-directory: market-gateway
        run: node --test test/firebase-to-supabase-transform.test.js
