name: Firebase Supabase role-claim backfill tests

on:
  pull_request:
    paths:
      - "functions/lib/supabase-role-claim-backfill.js"
      - "functions/backfill-supabase-role-claims.js"
      - "functions/test/supabase-role-claim-backfill.test.js"
      - ".github/workflows/firebase-supabase-role-claim-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-claim-backfill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backfill utility syntax
        run: node --check functions/backfill-supabase-role-claims.js
      - name: Run role-claim backfill unit tests
        run: node --test functions/test/supabase-role-claim-backfill.test.js
