name: Audit — Supabase role and RLS security checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-rls-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_trading_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_trading_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_trading_security_test
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
      - name: Checkout PR #70 draft source read-only
        uses: actions/checkout@v4
        with:
          ref: migration/supabase-paper-trading-schema-draft-2026-11-22
          path: pr70-source
      - name: Prepare minimal Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          SQL
      - name: Apply PR #70 draft migrations to disposable PostgreSQL only
        run: |
          set -euo pipefail
          for migration in pr70-source/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert RPC grants, table grants, RLS isolation and watchlist ownership
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/supabase-role-rls-security.sql
