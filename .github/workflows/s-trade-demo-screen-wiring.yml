name: S-TRADE Demo Screen Wiring Tests

on:
  pull_request:
    paths:
      - "markets/shared/paper-demo-adapter.mjs"
      - "markets/stocks/demo.html"
      - "markets/stocks/demo.css"
      - "markets/stocks/demo.js"
      - "markets/stocks/index.html"
      - "market-gateway/test/paper-demo-dashboard.test.mjs"
      - "markets/stocks/demo-browser-smoke.cjs"
      - "markets/service-worker.js"
      - "markets/stocks/demo-chart-data.mjs"
      - "markets/stocks/demo-chart-panel.mjs"
      - "markets/stocks/demo-equity-panel.mjs"
      - "markets/stocks/demo-derivative-panel.mjs"
      - "markets/stocks/demo-watchlist-persistence.mjs"
      - "markets/stocks/demo-watchlist-state.mjs"
      - "market-gateway/test/demo-watchlist-state.test.mjs"
      - "market-gateway/lib/watchlist-instrument-resolver.js"
      - "market-gateway/test/watchlist-instrument-resolver.test.js"
      - "markets/stocks/demo-chart-panel.mjs"
      - "market-gateway/supabase-server.js"
      - "markets/stocks/demo-browser-smoke.cjs"
      - "markets/service-worker.js"
      - "market-gateway/test/demo-chart-data.test.mjs"
      - ".github/workflows/s-trade-demo-screen-wiring.yml"
  push:
    branches:
      - feature/s-trade-round2-demo-screen-wiring-2026-11-24
      - feature/s-trade-watchlist-persistence-demo-2026-11-25
    paths:
      - "markets/shared/paper-demo-adapter.mjs"
      - "markets/stocks/demo.html"
      - "markets/stocks/demo.css"
      - "markets/stocks/demo.js"
      - "markets/stocks/index.html"
      - "market-gateway/test/paper-demo-dashboard.test.mjs"
      - "markets/stocks/demo-watchlist-persistence.mjs"
      - "markets/stocks/demo-watchlist-state.mjs"
      - "market-gateway/lib/watchlist-instrument-resolver.js"
      - "market-gateway/test/watchlist-instrument-resolver.test.js"
      - "market-gateway/test/demo-watchlist-state.test.mjs"
      - "market-gateway/test/paper-demo-derivative-integration.test.mjs"
      - "market-gateway/test/paper-demo-equity-integration.test.mjs"
      - "markets/stocks/demo-browser-smoke.cjs"
      - "markets/service-worker.js"
      - "markets/pwa-register.js"
      - "market-gateway/supabase-server.js"
      - ".github/workflows/s-trade-demo-screen-wiring.yml"

permissions:
  contents: read

jobs:
  demo-screen-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Supabase gateway syntax
        run: node --check market-gateway/supabase-server.js
      - name: Check canonical MOCK watchlist resolver syntax
        run: node --check market-gateway/lib/watchlist-instrument-resolver.js
      - name: Check shared Demo adapter syntax
        run: node --check markets/shared/paper-demo-adapter.mjs
      - name: Check service worker syntax
        run: node --check markets/service-worker.js
      - name: Check Demo browser smoke syntax
        run: node --check markets/stocks/demo-browser-smoke.cjs
      - name: Check Demo screen module syntax
        run: node --check markets/stocks/demo.js && node --check markets/stocks/demo-chart-data.mjs && node --check markets/stocks/demo-chart-panel.mjs && node --check markets/stocks/demo-equity-panel.mjs && node --check markets/stocks/demo-derivative-panel.mjs && node --check markets/stocks/demo-watchlist-persistence.mjs && node --check markets/stocks/demo-watchlist-state.mjs
      - name: Validate shared fixtures
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const name of ['market','account','equity','derivatives']) JSON.parse(fs.readFileSync('market-gateway/mock/fixtures/'+name+'.json','utf8'));
          console.log('Parsed all four canonical screen fixtures.');
          NODE
      - name: Run adapter and screen integration tests
        run: node --test market-gateway/test/paper-demo-adapter.test.mjs market-gateway/test/paper-demo-dashboard.test.mjs market-gateway/test/paper-demo-derivative-integration.test.mjs market-gateway/test/paper-demo-equity-integration.test.mjs market-gateway/test/demo-chart-data.test.mjs market-gateway/test/demo-watchlist-state.test.mjs market-gateway/test/watchlist-instrument-resolver.test.js
      # Chart model, panel, and regression tests are included in this exact-head gate.
      - name: Install Chromium browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/zenura-playwright" playwright@1.61.1 axe-core@4.10.3 --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/zenura-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run desktop, mobile, accessibility, performance and offline PWA smoke
        timeout-minutes: 12
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/zenura-static-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/zenura-static-server.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/markets/stocks/demo.html >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/markets/stocks/demo.html >/dev/null
          NODE_PATH="$RUNNER_TEMP/zenura-playwright/node_modules" node markets/stocks/demo-browser-smoke.cjs
      - name: Guard production gateway isolation
        run: |
          if grep -R "paper-demo-adapter" market-gateway/supabase-server.js market-gateway/server.js; then
            echo "Browser demo adapter must not be imported into production gateway routes."
            exit 1
          fi
