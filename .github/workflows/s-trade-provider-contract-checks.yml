name: S-TRADE Provider Contract Checks

on:
  push:
    branches:
      - feature/s-trade-multi-provider-market-data-2026-11-24
      - feature/s-trade-indian-market-data-compliance-gate-2026-11-26
    paths:
      - "market-gateway/lib/*provider-contract.js"
      - "market-gateway/lib/provider-market-data-adapters.js"
      - "market-gateway/lib/upstox-stream-normalizer.js"
      - "market-gateway/lib/upstox-stream-session.js"
      - "market-gateway/test/upstox-stream-session.test.js"
      - "market-gateway/lib/upstox-feed-decoder.js"
      - "market-gateway/lib/angelone-stream-decoder.js"
      - "market-gateway/test/angelone-stream-decoder.test.js"
      - "market-gateway/test/upstox-feed-decoder.test.js"
      - "market-gateway/test/upstox-stream-normalizer.test.js"
      - "market-gateway/test/provider-market-data-adapters.test.js"
      - "market-gateway/test/provider-adapter-router.integration.test.js"
      - "market-gateway/lib/market-data-provider-router.js"
      - "market-gateway/lib/provider-market-data-adapters.js"
      - "market-gateway/test/provider-market-data-adapters.test.js"
      - "market-gateway/lib/provider-paper-trading-policy.js"
      - "market-gateway/lib/market-data-rights-gate.js"
      - "market-gateway/supabase-server.js"
      - "market-gateway/test/market-data-rights-gate.test.js"
      - "market-gateway/test/market-data-distribution-compliance.test.js"
      - "market-gateway/test/market-data-instruments-route-compliance.test.js"
      - ".github/workflows/deploy-supabase-market-gateway.yml"
      - "market-gateway/lib/provider-rate-limit.js"
      - "market-gateway/lib/provider-health-registry.js"
      - "market-gateway/lib/distributed-provider-rate-limit.js"
      - "market-gateway/lib/instrument-identity.js"
      - "market-gateway/test/instrument-identity.test.js"
      - "market-gateway/test/provider-contract.test.js"
      - "market-gateway/test/market-data-router.test.js"
      - "market-gateway/test/provider-paper-trading-policy.test.js"
      - "market-gateway/test/market-data-shapes.test.js"
      - "market-gateway/test/provider-health-registry.test.js"
      - "market-gateway/test/distributed-provider-rate-limit.test.js"
      - "supabase/migrations/*market_data_distributed_provider_quotas.sql"
      - "market-gateway/PROVIDER-CAPABILITY-MATRIX.md"
      - "market-gateway/MARKET-DATA-COMPLIANCE.md"
      - "market-gateway/PROVIDER-ROUTING-OPERATIONS.md"
      - ".github/workflows/s-trade-provider-contract-checks.yml"
  pull_request:
    branches:
      - feature/s-trade-upstox-oauth-market-data-security-2026-11-23
      - feature/s-trade-multi-provider-market-data-2026-11-24
    paths:
      - "market-gateway/lib/*provider-contract.js"
      - "market-gateway/lib/provider-market-data-adapters.js"
      - "market-gateway/lib/upstox-stream-normalizer.js"
      - "market-gateway/lib/upstox-feed-decoder.js"
      - "market-gateway/test/upstox-feed-decoder.test.js"
      - "market-gateway/test/provider-market-data-adapters.test.js"
      - "market-gateway/test/upstox-stream-normalizer.test.js"
      - "market-gateway/lib/market-data-provider-router.js"
      - "market-gateway/lib/provider-paper-trading-policy.js"
      - "market-gateway/lib/market-data-rights-gate.js"
      - "market-gateway/supabase-server.js"
      - "market-gateway/test/market-data-rights-gate.test.js"
      - "market-gateway/test/provider-paper-trading-policy.test.js"
      - "market-gateway/test/market-data-distribution-compliance.test.js"
      - "market-gateway/test/market-data-instruments-route-compliance.test.js"
      - "market-gateway/MARKET-DATA-COMPLIANCE.md"
      - ".github/workflows/s-trade-provider-contract-checks.yml"
      - "market-gateway/lib/provider-rate-limit.js"
      - "market-gateway/lib/provider-health-registry.js"
      - "market-gateway/lib/distributed-provider-rate-limit.js"
      - "market-gateway/lib/instrument-identity.js"
      - "market-gateway/test/instrument-identity.test.js"
      - "market-gateway/test/provider-contract.test.js"
      - "market-gateway/test/market-data-router.test.js"
      - "market-gateway/test/market-data-shapes.test.js"
      - "market-gateway/test/provider-health-registry.test.js"
      - "market-gateway/test/distributed-provider-rate-limit.test.js"
      - "supabase/migrations/*market_data_distributed_provider_quotas.sql"
      - "market-gateway/PROVIDER-CAPABILITY-MATRIX.md"
      - "market-gateway/PROVIDER-ROUTING-OPERATIONS.md"
      - ".github/workflows/s-trade-provider-contract-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production gateway dependencies required by provider tests
        run: npm install --prefix market-gateway --omit=dev --no-audit --no-fund --package-lock=false
      - name: Check provider contract, router and quota adapter syntax
        run: |
          node --check market-gateway/lib/market-data-provider-contract.js
          node --check market-gateway/lib/broker-execution-provider-contract.js
          node --check market-gateway/lib/market-data-provider-router.js
          node --check market-gateway/lib/provider-market-data-adapters.js
          node --check market-gateway/lib/upstox-stream-normalizer.js
          node --check market-gateway/lib/upstox-stream-session.js
          node --check market-gateway/lib/upstox-feed-decoder.js
          node --check market-gateway/lib/angelone-stream-decoder.js
          node --check market-gateway/lib/provider-paper-trading-policy.js
          node --check market-gateway/lib/market-data-rights-gate.js
          node --check market-gateway/supabase-server.js
          node --check market-gateway/test/market-data-instruments-route-compliance.test.js
          node --check market-gateway/lib/provider-rate-limit.js
          node --check market-gateway/lib/provider-health-registry.js
          node --check market-gateway/lib/distributed-provider-rate-limit.js
          node --check market-gateway/lib/instrument-identity.js
      - name: Run provider contract, routing, outage, health and distributed quota tests
        run: node --test market-gateway/test/provider-contract.test.js market-gateway/test/provider-market-data-adapters.test.js market-gateway/test/upstox-stream-normalizer.test.js market-gateway/test/upstox-stream-session.test.js market-gateway/test/upstox-feed-decoder.test.js market-gateway/test/angelone-stream-decoder.test.js market-gateway/test/provider-adapter-router.integration.test.js market-gateway/test/market-data-router.test.js market-gateway/test/provider-paper-trading-policy.test.js market-gateway/test/market-data-rights-gate.test.js market-gateway/test/market-data-distribution-compliance.test.js market-gateway/test/market-data-instruments-route-compliance.test.js market-gateway/test/market-data-shapes.test.js market-gateway/test/provider-health-registry.test.js market-gateway/test/distributed-provider-rate-limit.test.js market-gateway/test/instrument-identity.test.js
